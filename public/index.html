<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mafija</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mafija">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#14121c;color:#eee;padding:16px;max-width:560px;margin:auto}
h1,h2{text-align:center}
button{background:#7b2cbf;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:16px;margin:4px 0;cursor:pointer}
button.sec{background:#3a3550}button.red{background:#b3261e}button.big{width:100%;padding:16px}
button:disabled{opacity:.4}
input{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#fff}
.card{background:#1f1b2d;border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pick{display:block;width:100%;text-align:left;background:#2a2540}
.pick.sel{background:#2e8b57}
.role{font-size:40px;text-align:center;margin:30px 0;font-weight:bold}
.mafia{color:#ff4d4d}.city{color:#4dd2ff}
.dead{opacity:.45;text-decoration:line-through}
.err{color:#ff6b6b;text-align:center}
small{color:#aaa}
body{transition:background .8s}
body.night{background:#0a0d1f}body.day{background:#2a2540}
#sky{position:fixed;top:10px;left:14px;font-size:34px;pointer-events:none;z-index:5;transition:opacity .6s}
#sky.pop{animation:skyIn 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes skyIn{from{transform:translateY(-60px) rotate(-60deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
button{transition:transform .12s,background .25s,filter .2s}
button:active{transform:scale(.95)}
.pick:hover{filter:brightness(1.15)}
.pick.sel{animation:selPop .25s}
@keyframes selPop{50%{transform:scale(1.04)}}
.enter>*{animation:rise .45s both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.flip{animation:flip .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg) scale(.6);opacity:0}to{transform:perspective(600px) rotateY(0);opacity:1}}
.glow-mafia{text-shadow:0 0 18px #ff1f1f,0 0 40px #a00}
.glow-city{text-shadow:0 0 18px #4dd2ff,0 0 40px #07a}
.donkey{display:inline-block;animation:hop .45s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-22px) rotate(-10deg)}}
.dead{opacity:.45;filter:grayscale(1)}
.enter .dead{animation:fade 1s .3s both}
@keyframes fade{from{opacity:1;filter:none}to{opacity:.45;filter:grayscale(1)}}
.enter .shake{animation:shake .6s .4s}
.fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;font-size:140px;animation:fxIn 2s ease-out forwards}
.fx.kill{background:radial-gradient(circle,rgba(160,0,0,.55),rgba(0,0,0,.2));filter:drop-shadow(0 0 30px #f00)}
.fx.save{background:radial-gradient(circle,rgba(30,170,80,.5),rgba(0,0,0,.1));filter:drop-shadow(0 0 30px #2f6)}
@keyframes fxIn{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.enter .flip{animation:flip .8s cubic-bezier(.2,.9,.3,1.2) both}
.flip{animation:none}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pulse-mafia{animation:pulseM 1.2s ease-in-out infinite}
@keyframes pulseM{50%{transform:scale(1.07);text-shadow:0 0 30px #f00}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky"></div>
<h1>🕵️ Mafija</h1>
<div id="app"></div>
<script>
const $app = document.getElementById('app');
const ROLE = {mafia:'🔪 MAFIJA', dama:'💋 DAMA (mafija)', doctor:'🩺 DOKTOR (grad)', police:'👮 POLICAJAC (grad)', citizen:'🏘️ GRAĐANIN (grad)'};
const ROLE_SHORT = {mafia:'Mafija', dama:'Dama', doctor:'Doktor', police:'Policajac', citizen:'Građanin'};
let S = null, sel = new Set(), mafiaN = 1, err = '';
let N = null; // stanje noći
let revealed = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, body) {
  const r = await fetch(path, {method: body === undefined ? 'GET' : 'POST', body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json();
  if (r.status === 401 && path !== '/api/login') { S = null; return showLogin(); }
  if (!r.ok) throw new Error(j.error || 'Greška');
  return j;
}
async function act(path, body) {
  err = '';
  try {
    const r = await api(path, body || {});
    if (r && r.state) { S = r.state; render(); return; }
  } catch (e) { err = e.message; }
  await refresh();
}
async function refresh() {
  try { S = await api('/api/state'); } catch (e) { return; }
  if (S) render();
}

function showLogin(msg) {
  $app.innerHTML = `<div class="card"><h2>Šifra</h2><input id="pw" type="password" placeholder="Unesi šifru" autofocus>
  <button class="big" id="go">Uđi</button><p class="err">${msg || ''}</p></div>`;
  const go = async () => {
    try { await api('/api/login', {password: document.getElementById('pw').value}); refresh(); }
    catch (e) { showLogin(e.message); }
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

let lastKey = null;
function confetti() {
  const cols = ['#4dd2ff', '#ffd24d', '#7b2cbf', '#2e8b57', '#ff6b9d'];
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[i % cols.length];
    d.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    d.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 5500);
  }
}
function decorate(g) {
  const phase = g ? g.phase : 'setup';
  const key = [phase, g && g.round, g && g.reveal_idx, revealed !== null, handed, N && N.step, donkeyShownFor].join('|');
  const sky = document.getElementById('sky');
  const mode = phase === 'night' ? 'night' : phase === 'day' ? 'day' : '';
  document.body.className = mode;
  const icon = mode === 'night' ? '🌙' : mode === 'day' ? '☀️' : '';
  if (sky.textContent !== icon) { sky.textContent = icon; sky.classList.remove('pop'); void sky.offsetWidth; if (icon) sky.classList.add('pop'); }
  if (key === lastKey) { $app.classList.remove('enter'); return; }
  lastKey = key;
  [...$app.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 12)));
  $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter');
  if (phase === 'over') { if (g.winner === 'city') confetti(); }
  if (phase === 'day' && (g.event === 'kill' || g.event === 'save')) {
    const f = document.createElement('div');
    f.className = 'fx ' + g.event;
    f.textContent = g.event === 'kill' ? '💀' : '🛡️';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 2100);
  }
}

function render() {
  const g = S.game;
  if (!g) { N = null; renderSetup(); }
  else if (g.phase === 'reveal') renderReveal(g);
  else if (g.phase === 'leader') renderLeader(g);
  else if (g.phase === 'night') renderNight(g);
  else if (g.phase === 'day') renderDay(g);
  else renderOver(g);
  decorate(g);
  const bar = document.createElement('div');
  const stale = document.getElementById('ab'); if (stale) stale.remove();
  bar.style.marginTop = '24px';
  if (!g) {
    bar.innerHTML = '<button class="sec big" id="rs">Restart stats</button>';
    $app.appendChild(bar);
    document.getElementById('rs').onclick = () => {
      if (confirm('Resetovati statistiku svih igrača na 0?')) act('/api/reset_stats');
    };
  } else if (g.phase !== 'over') {
    const old = document.getElementById('ab'); if (old) old.remove();
    bar.innerHTML = '<button id="ab" title="Prekini igru" style="position:fixed;right:8px;bottom:8px;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:#2a2735;color:#666;font-size:16px;opacity:.6;z-index:30">🔄</button>';
    document.body.appendChild(bar.firstChild);
    document.getElementById('ab').onclick = () => {
      if (confirm('Prekinuti igru? Statistika se neće upisati.')) { N = null; revealed = null; votePick = null; handed = false; act('/api/end'); }
    };
  }
}

function renderSetup() {
  const ps = S.players;
  const rank = [...ps].map(p => ({...p, w: (p.city_wins || 0) + (p.mafia_wins || 0), g: p.games || 0}))
    .filter(p => p.g > 0).sort((a, b) => b.w - a.w || (b.w / b.g) - (a.w / a.g) || a.g - b.g).slice(0, 3);
  const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
  const board = rank.length ? `<div class="card"><h3 style="margin:0 0 8px;text-align:center">🏆 Ljestvica</h3>
    ${rank.map((p, i) => `<div class="row" style="padding:4px 0"><span>${medal(i)} <b>${esc(p.name)}</b></span>
    <small>${p.w} pobjeda / ${p.g} igara (${Math.round(100 * p.w / p.g)}%) · 🏘️ ${p.city_wins || 0} · 🔪 ${p.mafia_wins || 0}</small></div>`).join('')}</div>` : '';
  $app.innerHTML = board + `
  <h2>Igrači</h2>
  <div class="card row"><input id="nm" placeholder="Ime novog igrača"><button id="add">Dodaj</button></div>
  ${ps.map(p => `<div class="card row">
    <label style="flex:1"><input type="checkbox" style="width:auto" data-id="${p.id}" ${sel.has(p.id) ? 'checked' : ''}>
    <b>${esc(p.name)}</b><br><small>Grad pobjede: ${p.city_wins || 0} · Mafija pobjede: ${p.mafia_wins || 0} · Igara: ${p.games || 0}</small></label>
    <button class="red" data-del="${p.id}">✕</button></div>`).join('') || '<p style="text-align:center"><small>Nema igrača. Dodaj ih iznad.</small></p>'}
  <div class="card"><div class="row"><span>Broj obične mafije (uz damu)</span>
    <input id="mf" type="number" min="1" value="${mafiaN}" style="width:80px"></div>
    <small>Uvijek je 1 dama, 1 doktor, 1 policajac. Igrača: ${sel.size}</small></div>
  <div class="card"><label class="row" style="cursor:pointer"><span>⏱️ Tajmer rasprave (dan)</span>
    <input id="tOn" type="checkbox" style="width:auto" ${TM.on ? 'checked' : ''}></label>
    <div class="row" style="margin-top:8px;${TM.on ? '' : 'display:none'}" id="tRow"><span>Trajanje (minuta)</span>
    <input id="tMin" type="number" min="1" max="60" value="${TM.min}" style="width:80px"></div></div>
  <button class="big" id="start">Počni igru</button><p class="err">${esc(err)}</p>`;
  document.getElementById('add').onclick = () => {
    const el = document.getElementById('nm');
    act('/api/add', {name: el.value});
  };
  document.getElementById('nm').onkeydown = e => { if (e.key === 'Enter') document.getElementById('add').click(); };
  $app.querySelectorAll('input[data-id]').forEach(c => c.onchange = () => {
    c.checked ? sel.add(c.dataset.id) : sel.delete(c.dataset.id); render();
  });
  $app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const p = ps.find(x => x.id === b.dataset.del);
    if (confirm('Obrisati ' + p.name + '?')) { sel.delete(p.id); act('/api/delete', {id: p.id}); }
  });
  document.getElementById('mf').onchange = e => { mafiaN = parseInt(e.target.value) || 1; };
  document.getElementById('tOn').onchange = e => {
    TM.on = e.target.checked; tmSave();
    document.getElementById('tRow').style.display = TM.on ? '' : 'none';
  };
  document.getElementById('tMin').onchange = e => {
    TM.min = Math.min(60, Math.max(1, parseInt(e.target.value) || 3)); e.target.value = TM.min; tmSave();
  };
  document.getElementById('start').onclick = () => {
    mafiaN = parseInt(document.getElementById('mf').value) || 1;
    const ids = S.players.filter(p => sel.has(p.id)).map(p => p.id);
    revealed = null; TM.round = null; TM.end = null;
    act('/api/start', {ids, mafia: mafiaN});
  };
}

let donkeyShownFor = null;
function renderReveal(g) {
  const p = g.players[g.reveal_idx];
  if (revealed === null) {
    $app.innerHTML = `<h2>Daj telefon igraču</h2><div class="role">${esc(p.name)}</div>
    <small>Ostali ne gledaju! (${g.reveal_idx + 1}/${g.players.length})</small>
    <button class="big" id="show">Prikaži moju ulogu</button>`;
    document.getElementById('show').onclick = async () => {
      revealed = (await api('/api/reveal', {})).role; render();
    };
  } else if (p.name.trim().toLowerCase() === 'nihad' && donkeyShownFor !== p.id) {
    $app.innerHTML = `<h2>${esc(p.name)}</h2><div class="role"><span class="donkey">🫏</span> Magarac</div>`;
    setTimeout(() => { donkeyShownFor = p.id; render(); }, 1000);
  } else {
    const m = revealed === 'mafia' || revealed === 'dama';
    $app.innerHTML = `<h2>${esc(p.name)}</h2><div class="role flip ${m ? 'mafia glow-mafia' : 'city glow-city'}">${ROLE[revealed]}</div>
    <button class="big" id="hide">Sakrij i dalje</button>`;
    document.getElementById('hide').onclick = () => { revealed = null; act('/api/reveal_next'); };
  }
}

let handed = false;
function renderLeader(g) {
  if (!handed) {
    $app.innerHTML = `<h2>Svi su izabrali uloge</h2><div class="role">📱➡️👑</div>
    <small>Predaj telefon vođi.</small>
    <button class="big" id="h">Predaj vođi</button>`;
    document.getElementById('h').onclick = () => { handed = true; render(); };
    return;
  }
  $app.innerHTML = `<h2>Vođa, pogledaj uloge:</h2>
  ${g.players.map(p => `<div class="card row"><b>${esc(p.name)}</b>
    <span class="${p.role === 'mafia' || p.role === 'dama' ? 'mafia' : 'city'}">${ROLE_SHORT[p.role]}</span></div>`).join('')}
  <button class="big" id="b">Počni igru (prva noć)</button>`;
  document.getElementById('b').onclick = () => { handed = false; act('/api/begin'); };
}

const STEPS = ['mafia', 'doctor', 'police'];
const STEP_INFO = {
  mafia: ['🔪💋 Budi se mafija (i dama)', 'Koga mafija ubija?'],
  doctor: ['🩺 Budi se doktor', 'Koga doktor štiti?'],
  police: ['👮 Budi se policajac', 'Koga policajac provjerava?'],
};

function renderNight(g) {
  if (!N || N.round !== g.round) N = {round: g.round, step: 0, kill: null, silence: null, protect: null, result: null, pick: null, pick2: null};
  const step = STEPS[N.step];
  const alive = g.players.filter(p => p.alive);
  const dama = step === 'mafia' && alive.some(p => p.role === 'dama');
  const [title, q] = STEP_INFO[step];
  const last = N.step === STEPS.length - 1;
  const prev = g.log && g.log.length ? `<div class="card"><small>${g.log.map(esc).join('<br>')}</small></div>` : '';
  const list = (attr, cur) => alive.map(p => `<button class="pick ${cur === p.id ? 'sel' : ''}" ${attr}="${p.id}">${esc(p.name)}</button>`).join('');
  $app.innerHTML = `<h2>🌙 Noć ${g.round}</h2>${N.step === 0 ? prev : ''}
  <div class="card"><b>${title}</b><br><small>${q}</small></div>
  ${list('data-id', N.pick)}
  ${dama ? `<div class="card"><b>💋 Koga dama ušutkuje?</b><br><small>Može i sebe.</small></div>${list('data-sil', N.pick2)}` : ''}
  ${step === 'police' && N.result !== null ? `<div class="card role ${N.result ? 'mafia' : 'city'}" style="font-size:24px;margin:8px 0">${N.result ? 'JE mafija 👎' : 'NIJE mafija 👍'}</div>` : ''}
  <button class="big" id="next">${last ? 'Završi noć' : 'Dalje'}</button>
  <button class="sec big" id="skip">Preskoči (niko)</button>`;
  $app.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    N.pick = b.dataset.id;
    if (step === 'police') N.result = (await api('/api/check', {target: N.pick})).mafia;
    render();
  });
  $app.querySelectorAll('[data-sil]').forEach(b => b.onclick = () => { N.pick2 = b.dataset.sil; render(); });
  const go = async (skip) => {
    const t = skip ? null : N.pick;
    if (step === 'mafia') { N.kill = t; N.silence = N.pick2; }
    else if (step === 'doctor') N.protect = t;
    N.pick = null; N.pick2 = null; N.result = null;
    if (last) { const d = {kill: N.kill, silence: N.silence, protect: N.protect}; N = null; await act('/api/resolve', d); }
    else { N.step++; render(); }
  };
  document.getElementById('next').onclick = () => go(false);
  document.getElementById('skip').onclick = () => go(true);
}

let TM = {on: false, min: 3, round: null, end: null, left: null};
try { Object.assign(TM, JSON.parse(localStorage.getItem('mafijaTimer') || '{}')); } catch (e) {}
const tmSave = () => localStorage.setItem('mafijaTimer', JSON.stringify({on: TM.on, min: TM.min}));
let tmInt = null;
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function tmBeep() {
  try {
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator();
    o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + 0.6);
  } catch (e) {}
}
function tmTick() {
  const el = document.getElementById('tm');
  if (!el) { clearInterval(tmInt); tmInt = null; return; }
  if (TM.end) {
    const left = Math.max(0, Math.ceil((TM.end - Date.now()) / 1000));
    TM.left = left;
    if (left === 0) { TM.end = null; tmBeep(); }
  }
  el.textContent = TM.left === 0 ? '⏰ Vrijeme je isteklo!' : fmt(TM.left);
  el.classList.toggle('mafia', TM.left <= 10);
  const b = document.getElementById('tmBtn');
  if (b) b.textContent = TM.end ? '⏸️ Pauza' : (TM.left === TM.min * 60 ? '▶️ Start' : TM.left === 0 ? '🔁 Ponovo' : '▶️ Nastavi');
}
function tmBox(g) {
  if (!TM.on) return '';
  if (TM.round !== g.round) { TM.round = g.round; TM.end = null; TM.left = TM.min * 60; }
  if (!tmInt) tmInt = setInterval(tmTick, 250);
  return `<div class="card" style="text-align:center"><div class="role" id="tm" style="font-size:40px;margin:4px 0"></div>
  <button id="tmBtn" class="sec"></button> <button id="tmRst" class="sec">↺</button></div>`;
}
function tmBind() {
  const b = document.getElementById('tmBtn');
  if (!b) return;
  b.onclick = () => {
    if (TM.end) TM.end = null;
    else { if (TM.left === 0) TM.left = TM.min * 60; TM.end = Date.now() + TM.left * 1000; }
    tmTick();
  };
  document.getElementById('tmRst').onclick = () => { TM.end = null; TM.left = TM.min * 60; tmTick(); };
  tmTick();
}

let votePick = null;
function renderDay(g) {
  const alive = g.players.filter(p => p.alive);
  const sil = g.silenced ? g.players.find(p => p.id === g.silenced) : null;
  $app.innerHTML = `<h2>☀️ Dan ${g.round}</h2>
  <div class="card">${g.log.map(esc).join('<br>')}</div>
  ${sil ? `<div class="card shake">🤐 <b>${esc(sil.name)}</b> ne može glasati.</div>` : ''}
  ${tmBox(g)}
  <h3>Ko je izglasan?</h3>
  ${alive.map(p => `<button class="pick ${votePick === p.id ? 'sel' : ''}" data-id="${p.id}">${esc(p.name)}</button>`).join('')}
  <button class="big" id="ok">Potvrdi glasanje</button>
  <button class="sec big" id="none">Niko nije izglasan</button>
  <h3>Pregled uloga (vođa)</h3>
  ${g.players.map(p => `<div class="card row ${p.alive ? '' : 'dead'}"><b>${esc(p.name)}</b><span class="${p.role === 'mafia' || p.role === 'dama' ? 'mafia' : 'city'}">${ROLE_SHORT[p.role]}</span></div>`).join('')}`;
  tmBind();
  $app.querySelectorAll('.pick').forEach(b => b.onclick = () => { votePick = b.dataset.id; render(); });
  document.getElementById('ok').onclick = () => { const t = votePick; votePick = null; act('/api/vote', {target: t}); };
  document.getElementById('none').onclick = () => { votePick = null; act('/api/vote', {target: null}); };
}

function renderOver(g) {
  $app.innerHTML = `<h2>Kraj igre</h2>
  <div class="role ${g.winner === 'mafia' ? 'mafia pulse-mafia' : 'city'}">${g.winner === 'mafia' ? '🔪 Mafija pobjeđuje!' : '🏘️ Grad pobjeđuje!'}</div>
  <div class="card">${(g.log || []).map(esc).join('<br>')}</div>
  ${g.players.map(p => `<div class="card row ${p.alive ? '' : 'dead'}"><b>${esc(p.name)}</b><span>${ROLE_SHORT[p.role]}</span></div>`).join('')}
  <button class="big" id="e">Nova igra</button>`;
  document.getElementById('e').onclick = () => act('/api/end');
}

refresh().then(() => { if (!S) showLogin(); });
</script>
</body>
</html>
